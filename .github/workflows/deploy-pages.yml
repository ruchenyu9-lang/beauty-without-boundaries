# Builds the frontend in static-demo mode and deploys it to GitHub Pages.
#
# The FastAPI backend serves mock AI data and deterministic color math, so the
# demo reproduces the full app entirely in the browser (see
# frontend/src/api/mockServer.ts). Every push to main that touches the
# frontend redeploys the site automatically.
#
# Live URL: https://ruchenyu9-lang.github.io/beauty-without-boundaries/

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; skip queued builds for superseded commits.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Mock API smoke test
        working-directory: frontend
        run: node scripts/run-smoke.mjs

      - name: Build (static demo mode)
        working-directory: frontend
        run: npm run build -- --base=/beauty-without-boundaries/
        env:
          VITE_USE_MOCK_API: 'true'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
