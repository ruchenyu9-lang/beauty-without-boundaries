<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>美妆无界 · 路由跳转</title>
    <script>
      // GitHub Pages 不支持 SPA 回退：把原始地址暂存，回到首页后由 index.html 恢复。
      sessionStorage.setItem(
        'gh-pages-redirect',
        location.pathname + location.search + location.hash
      );
      location.replace('/beauty-without-boundaries/');
    </script>
  </head>
  <body>正在跳转…</body>
</html>
